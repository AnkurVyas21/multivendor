<div class="test-drive-requests">
  <div style="display: flex;justify-content: space-between;align-items: center;">
    <div>
      <h4>Vendors List</h4>
    </div>
    <div style="margin-top: 2vw;">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" />
      </mat-form-field>
    </div>
  </div>


  <!-- Table to display test drive requests -->
  <div>
    <div class="table-wrapper">
      <table mat-table [dataSource]="vendorList" class="table table-bordered table-hover" >

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
        </ng-container>

        <!-- Phone Column -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef> Phone </th>
          <td mat-cell *matCellDef="let element"> {{ element.phone }} </td>
        </ng-container>

        <!-- Enabled Column -->
        <ng-container matColumnDef="enabled">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> {{ element.enabled ? 'Enabled' : 'Disabled' }} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let element"> {{ element.date }} </td>
        </ng-container>

        <!-- License Column -->
        <ng-container matColumnDef="license">
          <th mat-header-cell *matHeaderCellDef> License </th>
          <td mat-cell *matCellDef="let element"> {{ element.license }} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-center"> Actions </th>
          <td mat-cell *matCellDef="let element" class="text-center approveDecline">
            <button *ngIf="!element.enabled" (click)="approve(element,$event)" class="btn btn-success btn-sm" title="approve">
              <i class="fas fa-check"></i>
            </button>
            <button *ngIf="element.enabled" (click)="decline(element,$event)" class="btn btn-danger btn-sm" title="reject">
              <i class="fas fa-times"></i>
            </button>
          </td>
        </ng-container>

        <!-- Table Header & Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns" ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="navigateToDetails(row)"></tr>

      </table>
    </div>
  </div>



  <!-- No results message -->
  <div *ngIf="vendorList.length === 0" class="no-results">
    No Vendor found.
  </div>
</div>
